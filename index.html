<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>宇宙一のカフェ ― カフェ・ルーレット</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Yusei+Magic&family=Zen+Maru+Gothic:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --board:#22302a;
  --board-2:#1b2621;
  --frame:#6e4b2f;
  --chalk:#ece8dd;
  --chalk-dim:#a9b3a8;
  --chalk-yellow:#f1cf6a;
  --chalk-pink:#ee9aa5;
  --chalk-mint:#9fd8c0;
  --brass:#d9a441;
  --espresso:#2a1a0e;
  --jp:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Hiragino Sans","Yu Gothic","Meiryo",sans-serif;
  --chalkfont:"Yusei Magic","Zen Maru Gothic","Hiragino Maru Gothic ProN","Yu Gothic",sans-serif;
  --display:"Dela Gothic One","Hiragino Sans","Yu Gothic",sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--espresso);color:var(--chalk);font-family:var(--jp)}
body{overflow:hidden}
#app{display:grid;grid-template-columns:minmax(340px,410px) 1fr;height:100vh;height:100dvh;
  padding:env(safe-area-inset-top,0) env(safe-area-inset-right,0) env(safe-area-inset-bottom,0) env(safe-area-inset-left,0)}

/* ---------- 黒板パネル ---------- */
#panel{order:0;position:relative;overflow-y:auto;overflow-x:hidden;
  background:
    radial-gradient(120% 60% at 20% 0%,rgba(255,255,255,.06),transparent 60%),
    radial-gradient(90% 50% at 90% 100%,rgba(255,255,255,.04),transparent 60%),
    var(--board);
  border:12px solid var(--frame);
  border-image:linear-gradient(135deg,#7d5634,#5a3a22 40%,#8a6040 70%,#5a3a22) 1;
  padding:22px 22px 28px}
#panel h1{font-family:var(--display);font-weight:400;font-size:30px;line-height:1.15;margin:0 0 6px;
  color:var(--chalk);letter-spacing:.02em;text-shadow:0 0 1px rgba(255,255,255,.5)}
#panel h1 small{display:block;font-family:var(--chalkfont);font-size:15px;color:var(--chalk-yellow);margin-top:6px;letter-spacing:.04em}
.lead{font-family:var(--chalkfont);font-size:14px;line-height:1.75;color:var(--chalk-dim);margin:10px 0 18px}

#slots{list-style:none;margin:0 0 18px;padding:0;border-top:2px dashed rgba(236,232,221,.25)}
#slots li{display:grid;grid-template-columns:34px 1fr auto;align-items:center;gap:10px;
  padding:10px 2px;border-bottom:2px dashed rgba(236,232,221,.25);min-height:62px}
#slots .ic{font-size:22px;text-align:center}
#slots .cat{display:block;font-family:var(--chalkfont);font-size:13px;color:var(--chalk-yellow)}
#slots .nm{display:block;font-family:var(--chalkfont);font-size:18px;line-height:1.3;color:var(--chalk);word-break:break-all}
#slots .tg{display:inline-block;margin-left:6px;font-size:12px;color:var(--chalk-pink);border:1.5px solid var(--chalk-pink);
  border-radius:12px;padding:0 7px;vertical-align:2px;font-family:var(--chalkfont)}
#slots .pt{font-family:var(--display);font-size:20px;color:var(--chalk-mint);min-width:56px;text-align:right}
#slots .pt.neg{color:var(--chalk-pink)}
#slots li.spin .nm{color:var(--chalk-dim);filter:blur(.4px)}
#slots li.spin{background:rgba(241,207,106,.07)}
#slots li.set .nm{animation:chalkin .35s ease-out}
@keyframes chalkin{from{opacity:.2;transform:translateX(-4px)}to{opacity:1;transform:none}}

#go{display:block;width:100%;font-family:var(--display);font-size:22px;letter-spacing:.08em;
  color:var(--espresso);background:linear-gradient(#e8b957,#c98f2e);border:0;border-radius:10px;
  padding:16px 10px;cursor:pointer;box-shadow:0 4px 0 #8a5d17,0 8px 18px rgba(0,0,0,.35);
  transition:transform .08s,box-shadow .08s}
#go:active{transform:translateY(3px);box-shadow:0 1px 0 #8a5d17,0 4px 10px rgba(0,0,0,.35)}
#go:disabled{filter:grayscale(.5) brightness(.85);cursor:wait}
#go:focus-visible,summary:focus-visible{outline:3px solid var(--chalk-mint);outline-offset:3px}

#result{margin-top:22px;font-family:var(--chalkfont)}
#result[hidden]{display:none}
.total{display:flex;align-items:baseline;justify-content:space-between;gap:10px;border-bottom:2px solid rgba(236,232,221,.3);padding-bottom:8px}
.total b{font-family:var(--display);font-weight:400;font-size:34px;color:var(--chalk)}
.total span{font-size:14px;color:var(--chalk-dim)}
.sub{font-size:13px;color:var(--chalk-dim);margin:6px 0 14px}
.blk{margin:14px 0}
.blk h3{font-size:15px;font-weight:400;color:var(--chalk-yellow);margin:0 0 6px}
.blk ul{list-style:none;margin:0;padding:0}
.blk li{display:flex;justify-content:space-between;gap:10px;font-size:15px;line-height:1.5;padding:3px 0}
.blk li .p{color:var(--chalk-mint);white-space:nowrap}
.blk li .p.neg{color:var(--chalk-pink)}
.blk p{margin:0;font-size:15px;line-height:1.7}
.record{font-size:14px;color:var(--chalk-dim);margin-top:14px}

details{margin-top:22px;font-family:var(--chalkfont)}
summary{cursor:pointer;color:var(--chalk-yellow);font-size:15px}
#ranklist{list-style:none;margin:10px 0 0;padding:0;columns:2;column-gap:14px;font-size:13px;line-height:1.7}
#ranklist li{color:rgba(236,232,221,.35);break-inside:avoid}
#ranklist li.got{color:var(--chalk)}
#ranklist li.now{color:var(--chalk-yellow)}
#ranklist li b{display:inline-block;min-width:2.3em;font-weight:400}

/* ---------- 3Dステージ ---------- */
#stage{order:1;position:relative;overflow:hidden;background:#9ccfee}
#c{display:block;width:100%;height:100%;touch-action:none;cursor:grab}
#c:active{cursor:grabbing}
#banner{position:absolute;left:0;right:0;top:14px;text-align:center;pointer-events:none;padding:0 12px}
#banner[hidden]{display:none}
#banner .rk{font-family:var(--display);line-height:1;color:#fff;
  -webkit-text-stroke:2px var(--tier,#2a1a0e);paint-order:stroke fill;text-shadow:0 4px 0 var(--tier,#2a1a0e),0 8px 24px rgba(0,0,0,.35)}
#banner .rk b{font-weight:400;font-size:clamp(54px,9vw,96px)}
#banner .rk small{font-size:clamp(18px,2.4vw,26px);margin-left:4px}
#banner h2{display:inline-block;margin:8px 0 0;font-family:var(--display);font-weight:400;font-size:clamp(20px,3vw,32px);
  color:#fff;background:var(--tier,#2a1a0e);padding:6px 16px 8px;border-radius:6px;box-shadow:0 6px 18px rgba(0,0,0,.3)}
#banner.pop{animation:pop .7s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{from{transform:scale(.4);opacity:0}to{transform:none;opacity:1}}
#toasts{position:absolute;left:12px;bottom:12px;display:flex;flex-direction:column;gap:6px;pointer-events:none;max-width:calc(100% - 24px)}
.toast{font-family:var(--jp);font-weight:700;font-size:14px;color:#fff;background:rgba(20,18,30,.78);
  border-left:4px solid var(--c,#d9a441);padding:7px 12px;border-radius:4px;animation:tin .35s ease-out;backdrop-filter:blur(4px)}
.toast.out{opacity:0;transition:opacity .6s}
@keyframes tin{from{transform:translateX(-14px);opacity:0}to{transform:none;opacity:1}}
#hint{position:absolute;right:12px;bottom:12px;font-size:12px;color:rgba(255,255,255,.85);background:rgba(0,0,0,.28);
  padding:4px 10px;border-radius:12px;pointer-events:none}
#err{position:absolute;inset:0;display:none;align-items:center;justify-content:center;text-align:center;padding:20px;color:#fff;background:#2a1a0e;font-size:15px;line-height:1.7}

/* ---------- 映画風の演出 ---------- */
#stage .lb{position:absolute;left:0;right:0;height:0;background:#000;pointer-events:none;transition:height .5s ease;z-index:1}
#stage .lb.t{top:0}
#stage .lb.b{bottom:0}
#stage.cine .lb{height:8%}
#cap{position:absolute;left:50%;bottom:calc(8% + 16px);transform:translateX(-50%);display:flex;align-items:center;gap:12px;
  width:max-content;max-width:calc(100% - 32px);padding:8px 16px 9px;background:rgba(18,14,10,.66);border:1px solid rgba(241,207,106,.45);
  border-radius:8px;color:#fff;backdrop-filter:blur(6px);pointer-events:none;z-index:2;opacity:0;transition:opacity .3s}
#cap.on{opacity:1}
#cap.swap{animation:capin .45s ease-out}
@keyframes capin{from{opacity:0;transform:translate(-50%,8px)}to{opacity:1;transform:translate(-50%,0)}}
#cap .ci{font-size:26px;line-height:1}
#cap .ct{min-width:0}
#cap small{display:block;font-size:12px;color:var(--chalk-yellow);letter-spacing:.06em}
#cap b{display:block;font-family:var(--display);font-weight:400;font-size:clamp(16px,2.3vw,24px);line-height:1.25;word-break:break-all}
#cap .cp{font-family:var(--display);font-size:20px;color:var(--chalk-mint);white-space:nowrap}
#cap .cp.neg{color:var(--chalk-pink)}
#dots{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(4% - 2px);display:flex;gap:6px;z-index:2;opacity:0;transition:opacity .3s;pointer-events:none}
#stage.cine #dots{opacity:1}
#dots i{width:22px;height:4px;border-radius:2px;background:rgba(255,255,255,.28)}
#dots i.on{background:var(--chalk-yellow)}
#dots i.done{background:rgba(241,207,106,.6)}
#skip{position:absolute;right:12px;top:calc(8% + 10px);z-index:3;display:none;font:700 13px var(--jp);color:#fff;background:rgba(0,0,0,.45);
  border:1px solid rgba(255,255,255,.45);border-radius:16px;padding:6px 14px;cursor:pointer}
#skip:focus-visible{outline:3px solid var(--chalk-mint);outline-offset:2px}
#stage.cine #skip{display:block}
#stage.cine #hint{display:none}
#stage.cine #toasts{bottom:calc(8% + 84px)}

@media (max-width:820px){
  #cap{gap:8px;padding:6px 10px 7px;bottom:calc(8% + 10px)}
  #cap .ci{font-size:20px}
  #cap b{font-size:15px}
  #cap .cp{font-size:16px}
  #stage.cine #toasts{display:none}
  #app{grid-template-columns:1fr;grid-template-rows:48vh 1fr;grid-template-rows:48dvh 1fr}
  #stage{order:0}
  #panel{order:1;border-width:8px;padding:16px 16px 26px}
  #panel h1{font-size:24px}
  #banner{top:8px}
  #hint{display:none}
}
@media (prefers-reduced-motion:reduce){
  #banner.pop,.toast,#slots li.set .nm,#cap.swap{animation:none}
  #stage .lb{transition:none}
}
</style>
</head>

<div id="app">
  <aside id="panel">
    <h1>カフェ・ルーレット<small>今日のお店は、どこまで行ける？</small></h1>
    <p class="lead">コーヒー・サイドメニュー・サービス・清潔さ・立地・内装が1秒ずつ決まります。各100種類。合計点と組み合わせで、宇宙一から客ゼロまで100段階の格付けが決まります。開店後は、街並み・外観・店内・接客・一杯・ひと皿を3秒ずつ映し、最後にお店の全景を見せます。</p>
    <ol id="slots"></ol>
    <button id="go" type="button">開店する</button>
    <section id="result" hidden aria-live="polite"></section>
    <details>
      <summary>格付け一覧（100段階）</summary>
      <ol id="ranklist"></ol>
    </details>
  </aside>
  <section id="stage">
    <canvas id="c" aria-label="カフェの3D映像"></canvas>
    <div id="banner" hidden><div class="rk"><b id="bRank">1</b><small>位 / 100</small></div><h2 id="bTitle"></h2></div>
    <div class="lb t"></div><div class="lb b"></div>
    <div id="cap" aria-live="polite"></div>
    <div id="dots" aria-hidden="true"></div>
    <button id="skip" type="button">スキップ ▶▶</button>
    <div id="toasts"></div>
    <div id="hint">ドラッグで視点を回せます（ホイールで拡大）</div>
    <div id="err">3D表示を読み込めませんでした。ネットに接続した状態でページを再読み込みしてください。</div>
  </section>
</div>

const THEME_BONUS=[0,0,20,50,100,170,260];
function evaluate(picks){
  const base=picks.reduce((a,p)=>a+p.pts,0);
  const combos=[];
  const counts={};
  picks.forEach(p=>{ if(p.tag) counts[p.tag]=(counts[p.tag]||0)+1; });
  Object.keys(counts).forEach(t=>{
    const n=counts[t];
    if(n>=2) combos.push({name:`${TAGS[t].combo}（${TAGS[t].name}×${n}）`,pts:THEME_BONUS[n]});
  });
  const ix=picks.map(p=>p.idx);
  const [co,si,se,cl,pl,mo]=ix;
  if(ix.every(i=>i>=80)) combos.push({name:"全要素が一流",pts:80});
  if(co>=70&&si>=70) combos.push({name:"最高のペアリング",pts:30});
  if(co>=90&&ix.slice(1).every(i=>i<35)) combos.push({name:"味だけは本物の隠れた名店",pts:70});
  if(pl<10&&co>=85) combos.push({name:"秘境の名店",pts:40});
  if(se>=85&&co<20) combos.push({name:"店主の人柄でもっている店",pts:35});
  if(cl>=85&&mo>=85) combos.push({name:"息をのむ美空間",pts:30});
  if(pl>=80&&cl<20) combos.push({name:"一等地なのに不潔",pts:-60});
  if(mo>=80&&cl<15) combos.push({name:"豪華なのに埃まみれ",pts:-40});
  if(se<10&&cl<10) combos.push({name:"二度と来たくない店",pts:-30});
  if(ix.every(i=>i<15)) combos.push({name:"伝説の廃墟カフェ",pts:-50});
  if(new Set(ix.map(i=>i%10)).size===1) combos.push({name:"奇跡のぞろ目",pts:77});
  const bonus=combos.reduce((a,c)=>a+c.pts,0);
  const total=base+bonus;
  const p=1/(1+Math.exp(-(total-250)/62));
  const rank=Math.max(1,Math.min(100,100-Math.floor(p*100)));
  return {picks,base,bonus,total,combos,counts,rank};
}
function guestsPerDay(rank){ return rank===100?0:Math.round(3*Math.pow(1.085,100-rank)); }
function tierColor(rank){
  if(rank<=3) return "#7a2bb8";
  if(rank<=10) return "#b8860b";
  if(rank<=30) return "#c2412d";
  if(rank<=60) return "#2e6b57";
  if(rank<=85) return "#55606b";
  return "#3a3a3a";
}

const store={
  get(){ try{ return JSON.parse(localStorage.getItem("cafe-roulette")||"{}"); }catch(e){ return {}; } },
  set(v){ try{ localStorage.setItem("cafe-roulette",JSON.stringify(v)); }catch(e){} }
};
function renderRankList(current){
  const st=store.get(); const got=new Set(st.got||[]);
  $("#ranklist").innerHTML=RANKS.map((t,i)=>{
    const r=i+1; const cls=r===current?"now":got.has(r)?"got":"";
    return `<li class="${cls}"><b>${r}位</b>${got.has(r)||r===current?t:"？？？"}</li>`;
  }).join("");
}

function toast(text,color){
  const box=$("#toasts");
  const d=document.createElement("div");
  d.className="toast"; d.textContent=text; d.style.setProperty("--c",color||"#d9a441");
  box.appendChild(d);
  while(box.children.length>5) box.removeChild(box.firstChild);
  setTimeout(()=>d.classList.add("out"),3600);
  setTimeout(()=>d.remove(),4300);
}

let running=false;
$("#go").addEventListener("click",openShop);

async function openShop(){
  if(running) return;
  running=true;
  const btn=$("#go");
  btn.disabled=true; btn.textContent="抽選中…";
  $("#result").hidden=true;
  $("#banner").hidden=true;
  $("#toasts").innerHTML="";
  CATS.forEach(c=>{ c.li.classList.remove("set","spin"); c.li.querySelector(".nm").textContent="―"; const pt=c.li.querySelector(".pt"); pt.textContent=""; pt.classList.remove("neg"); });
  if(world) world.prepare();

  const picks=[];
  for(const c of CATS){
    const li=c.li, nm=li.querySelector(".nm"), pt=li.querySelector(".pt");
    li.classList.add("spin");
    const end=performance.now()+1000;
    while(performance.now()<end){
      nm.textContent=pick(c.items).name;
      await sleep(55);
    }
    const it=pick(c.items);
    picks.push(it);
    li.classList.remove("spin"); li.classList.add("set");
    nm.innerHTML="";
    nm.append(document.createTextNode(it.name));
    if(it.tag){ const tg=document.createElement("span"); tg.className="tg"; tg.textContent=TAGS[it.tag].name; nm.appendChild(tg); }
    pt.textContent=(it.pts>0?"+":"")+it.pts;
    pt.classList.toggle("neg",it.pts<0);
    await sleep(110);
  }

  const ev=evaluate(picks);
  const st=store.get();
  st.got=Array.from(new Set([...(st.got||[]),ev.rank]));
  st.plays=(st.plays||0)+1;
  const newBest=!st.best||ev.rank<st.best;
  if(newBest) st.best=ev.rank;
  store.set(st);

  const vips=world?world.run(ev,()=>showBanner(ev)):[];
  if(!world) showBanner(ev);
  showResult(ev,vips,st,newBest);
  renderRankList(ev.rank);

  btn.disabled=false; btn.textContent="もう一度開店する";
  running=false;
}

function showBanner(ev){
  const b=$("#banner");
  b.style.setProperty("--tier",tierColor(ev.rank));
  $("#bRank").textContent=ev.rank;
  $("#bTitle").textContent=RANKS[ev.rank-1];
  b.hidden=false;
  b.classList.remove("pop"); void b.offsetWidth; b.classList.add("pop");
}

function showResult(ev,vips,st,newBest){
  const r=$("#result");
  const combos=ev.combos.length

  function run(ev,onFinale){
    stopCine(); clearDyn(); inside=0;
    const rank=ev.rank, counts=ev.counts;
    const [co,si,se,cl,pl,mo]=ev.picks;
    const place=pl.tag;
    lastMode=setEnv(rank,place,mo); setInterior(mo,rank);
    const night=lastMode==="night"||lastMode==="space";
    drawSign(RANKS[rank-1],`第${rank}位 ／ 100`,rank<=10?"#ffd35c":"#e8b957");
    drawMenu(co.name,si.name);
    flicker=rank>=70||mo.idx<10; signMat.color.setHex(0xffffff);
    const busy=Math.pow((101-rank)/100,1.5);
    const cupSt=cupStyle(co), foodSt=foodStyle(si);
    const qOf=it=>it.idx>=75?2:it.idx>=25?1:-1;

    // 店員
    const sleepy=se.idx<10;
    const W=setupStaff(se,sleepy?"sleep":"idle");
    // 主役のテーブル
    const T0=TABLES[0];
    let heroA, heroB=null;
    if(rank===100){
      heroA=seatActor(T0.seats[0],{shirt:0xf4f1ea,apron:0x3b2415,hair:0x9a9a9a,glasses:true,female:false,style:"bald"},cupSt,foodSt,sleepy);
    } else {
      heroA=seatActor(T0.seats[0],{female:Math.random()<0.5},cupSt,foodSt,false);
      heroB=seatActor(T0.seats[1],{female:!heroA.r.female},cupSt,foodSt,sleepy);
      heroA.partner=heroB; heroB.partner=heroA;
    }
    [heroA,heroB].forEach(A=>{ if(A){ A.q=qOf(co); A.qf=qOf(si); A.next=99; } });
    const eater=heroB||heroA;
    const servedPlate=sleepy?null:makeFood(foodSt);
    if(servedPlate){ servedPlate.position.set(0,-50,0); dyn.add(servedPlate); }
    steam(()=>cupSt.kind==="glass"?null:heroA.cup.position.clone().add(new V3(0,0.05,0)));
    // その他の客
    const others=SEATS.filter(s=>s.table!==T0).sort(()=>Math.random()-0.5);
    const nSeat=rank===100?0:Math.round(Math.min(1,busy*1.8)*others.length);
    for(let i=0;i<nSeat;i++){ const A=seatActor(others[i],{},cupSt,foodSt,Math.random()<0.55); A.q=qOf(co); A.qf=qOf(si); }
    actors.forEach(A=>{ const mate=actors.find(B=>B!==A&&B.seat.table===A.seat.table); if(mate&&!A.partner) A.partner=mate; });
    // 通りの人々
    const walkers=rank===100?0:Math.min(small?10:16,Math.round(busy*22)+(rank<=90?1:0));
    for(let i=0;i<walkers;i++) spawnCustomer(rand(0,7));
    const passers=rank>=95?2:5;
    for(let i=0;i<passers;i++) spawnPasser(rand(0,8));
    if(rank<=40) queuePeople(Math.min(small?9:13,Math.round((41-rank)/40*15)+2));
    if(rank<=70&&place!=="u") traffic(rank<=30?4:2);

    const vips=[];
    let vi=0; const nextSpot=()=>VIPSPOTS[vi++%VIPSPOTS.length];
    let guardX=-2.2; const guardPos=()=>{ const p=[guardX,8.1]; guardX-=0.9; return p; };
    let d=1.2;
    if(rank<=30){
      const n=rank<=10?4:rank<=20?3:2;
      CELEBS.slice().sort(()=>Math.random()-0.5).slice(0,n).forEach(c=>{
        addVIP({shirt:c.shirt,glasses:true,shades:true,female:c.female,fast:true},c.n,"#a0247a",nextSpot(),[44,9],d,`🌟 ${c.n}がお忍びで来店`); vips.push(c.n); d+=1.3; });
      paparazzi();
    }
    if(rank<=19){
      carArrive(1.5,(car)=>{
        toast("🚗 日本の総理大臣が到着","#b8322a");
        const spot=nextSpot();
        const p=addP(makePerson({shirt:0x1d2433,pants:0x1d2433,tie:0x8a1c2b,hair:0x2a2a2a,female:false,collar:0xffffff,style:"side"}));
        p.position.set(car.position.x,0,11);
        label(p,"日本の総理大臣","#b8322a");
        walkTo(p,[[car.position.x,11],[spot[0],9],spot],1.3,()=>{ p.rotation.y=0.15; p.userData.idle=true; });
        [0,1].forEach(i=>{ const gp=guardPos(); const g=addP(makePerson(GUARD)); g.position.set(car.position.x+(i?1:-1),0,11); walkTo(g,[[g.position.x,11],gp],1.4,()=>{ g.rotation.y=0; g.userData.idle=true; }); });
      });
      vips.push("日本の総理大臣");
    }
    if(rank<=15){
      const n=rank<=8?3:1;
      PRES.slice(0,n).forEach(pr=>{
        addVIP({shirt:0x22314d,pants:0x22314d,tie:pr.tie,collar:0xffffff,female:false,style:pick(["side","short","bald"]),hair:pick([0x2b1d14,0x9a9a9a,0xd8b56a])},pr.n,"#1f3c8a",nextSpot(),[44,9.3],d+0.5,`🇺🇳 ${pr.n}が来店`);
        addGuard(guardPos(),[45,9.6],d+0.7); addGuard(guardPos(),[45.5,9.0],d+0.9);
        vips.push(pr.n); d+=1.6; });
    }
    if(rank<=12){
      const n=rank<=5?3:2;
      KINGS.slice(0,n).forEach(k=>{
        addVIP({crown:true,cape:k.cape,sash:k.sash,shirt:0xf0ead8,pants:0x2d2d2d,female:k.female,skirt:k.female?"skirt":null,skirtColor:k.cape,tights:0xf0ead8},k.n,"#8a1f2a",nextSpot(),[-44,9],d+0.8,`👑 ${k.n}が来店`);
        vips.push(k.n); d+=1.6; });
    }
    carpet.visible=rank<=30;
    if(rank<=6||(counts.u||0)>=3){ const n=rank<=3?5:rank<=6?3:2; vips.push(...ufoArrive(n)); }
    if((counts.n||0)>=2){ cats(3+(counts.n||0)); cats(2,[-3,6,-8.8,-1.2]); toast("🐈 猫たちが集まってきた","#e39b4a"); vips.push("近所の猫たち"); }
    else if(rank<=40||mo.tag==="n"||se.tag==="n") cats(1);
    if(rank<=10) fireworksLoop(rank<=3?2.2:1.2);
    if(rank<=20) searchlights();
    if(rank<=3) goldRing();
    if(rank<=5) confetti();
    if(rank>=80&&place!=="u") rain();
    if(rank>=82) crows(rank>=95?5:3);
    if(rank>=88) tumbleweed();
    if(cl.idx<20) dirt(cl.idx<10?2:1); else if(cl.idx>=60) sparkles(cl.idx>=85?40:18);
    if(rank===100) later(1.5,()=>toast("今日も誰も来なかった……","#555"));

    // ショット構成：立地 → 清潔さ → 内装 → サービス → コーヒー → サイド → 全景
    const cap=(i,sub)=>({icon:CATS[i].icon,label:`${CATS[i].label}｜${sub}`,name:ev.picks[i].name,pts:ev.picks[i].pts});
    const v=(x,y,z)=>new V3(x,y,z);
    const closeCam=(A,far)=>{ const s=A.seat, t=s.table, fx=Math.sin(s.ry); return far?v(t.x+fx*0.62,1.42,t.z+1.2):v(t.x+fx*0.45,1.28,t.z+0.88); };
    const faceOf=A=>{ const s=A.seat; return v(s.x+Math.sin(s.ry)*0.16,1.13,s.z+Math.cos(s.ry)*0.16); };
    const shots=[
      {dur:3,cap:cap(4,"街並み"),p0:v(70,58,110),p1:v(26,15,40),l0:v(0,14,-70),l1:v(0,4,-4)},
      {dur:3,cap:cap(3,"外観"),p0:v(-6.4,1.9,9.2),p1:v(-3.9,1.75,6.3),l0:v(0.4,2.1,0),l1:v(0.6,1.9,-0.6)},
      {dur:3,cap:cap(5,"店内"),p0:v(7.2,3.0,-0.55),p1:v(6.5,2.45,-1.25),l0:v(-2.5,1.2,-7),l1:v(-4,1.05,-7.6)},
      sleepy?{dur:3,cap:cap(2,"接客"),p0:v(-0.4,1.7,-4.4),p1:v(-0.9,1.55,-5.0),l0:v(-2.2,1.2,-6.8),l1:v(-2.25,1.15,-6.8)}
            :{dur:3,cap:cap(2,"接客"),p0:v(6.4,1.8,-0.75),p1:v(6.0,1.6,-1.15),l0:v(3.9,1.1,-3.4),l1:v(4.1,1.05,-3.3),start:()=>{ serveTo(W,eater,servedPlate); }},
      {dur:3,cap:cap(0,"至福の一杯"),p0:closeCam(heroA,true),p1:closeCam(heroA),l0:faceOf(heroA),l1:faceOf(heroA).add(v(0,-0.02,0.05)),start:()=>play(heroA,"sip")},
      {dur:3,cap:cap(1,"ひと皿"),p0:closeCam(eater,true),p1:closeCam(eater),l0:faceOf(eater),l1:faceOf(eater).add(v(0,-0.04,0.05)),start:()=>{ if(!eater.plate&&servedPlate){ givePlate(eater,servedPlate); servedPlate.position.copy(eater.plateHome); } play(eater,"bite"); }},
      {dur:3,finale:true}
    ];
    shots.forEach(s=>{ if(reduceMotion&&s.p1){ s.p0=s.p1; s.l0=s.l1; } });
    theta=0.32; phi=0.36; camR=baseR;
    later(24,()=>{ actors.forEach(A=>{ if(A.next>50) A.next=rand(1,4); }); });
    startCine(shots,onFinale);
    return vips;
  }
  // レッドカーペット（VIP用）
  const carpet=new THREE.Group(); carpet.visible=false; scene.add(carpet);
  plane(10.6,7.2,decal(bmat(0xd9a441)),-6.4,0.03,4.4,-Math.PI/2,0,carpet);
  plane(10,6.6,decal(mat(0xa3122a,{roughness:0.9})),-6.4,0.035,4.4,-Math.PI/2,0,carpet);
  [-1.2,-11.6].forEach(x=>[1.4,7.4].forEach(z=>{ mesh(new THREE.CylinderGeometry(0.05,0.07,1.0,10),M.brass,x,0.5,z,carpet); mesh(new THREE.SphereGeometry(0.08,10,8),M.brass,x,1.02,z,carpet); }));
  const VIPSPOTS=[];
  [2.3,4.4,6.5].forEach(z=>[-3,-5.1,-7.2,-9.3].forEach(x=>VIPSPOTS.push([x,z])));

  /* ---- カメラ操作 ---- */
  canvas.addEventListener("pointerdown",e=>{ if(cine.on){ skipCine(); } dragging=true; lx=e.clientX; ly=e.clientY; idle=0; canvas.setPointerCapture(e.pointerId); });
  canvas.addEventListener("pointermove",e=>{ if(!dragging||cine.on) return; theta-=(e.clientX-lx)*0.006; phi=Math.max(0.05,Math.min(1.3,phi+(e.clientY-ly)*0.004)); lx=e.clientX; ly=e.clientY; });
  const up=()=>{ dragging=false; idle=0; };
  canvas.addEventListener("pointerup",up); canvas.addEventListener("pointercancel",up);
  canvas.addEventListener("wheel",e=>{ e.preventDefault(); if(cine.on) return; camR=Math.max(10,Math.min(70,camR+e.deltaY*0.03)); },{passive:false});
  function resize(){
    const w=stage.clientWidth, h=stage.clientHeight;
    renderer.setSize(w,h,false); camera.aspect=w/Math.max(1,h); camera.updateProjectionMatrix();
    const nb=camera.aspect<0.8?48:camera.aspect<1.2?38:31;
    camR=camR-baseR+nb; baseR=nb;
  }
  window.addEventListener("resize",resize);
  if(window.ResizeObserver) new ResizeObserver(resize).observe(stage);
  resize();

  /* ---- ループ ---- */
  const clock=new THREE.Clock();
  const _cp=new V3();
  function loop(){
    requestAnimationFrame(loop);
    const dt=Math.min(0.05,clock.getDelta()); T+=dt;
    for(let i=timers.length-1;i>=0;i--){ if(timers[i]&&timers[i].at<=T){ const f=timers[i].fn; timers.splice(i,1); f(); } }
    for(let i=movers.length-1;i>=0;i--){
      const m=movers[i]; if(!m) continue;
      const tg=m.path[m.i]; const o=m.obj;
      const dx=tg.x-o.position.x, dz=tg.z-o.position.z; const dist=Math.hypot(dx,dz);
      const rig=o.userData.rig;
      if(dist<0.05){ m.i++; if(m.i>=m.path.length){ movers.splice(i,1); o.userData.moving=false; o.position.y=m.base; if(rig) poseStand(rig); if(m.onEnd) m.onEnd(); } continue; }
      const st=Math.min(dist,m.speed*dt);
      o.position.x+=dx/dist*st; o.position.z+=dz/dist*st;
      const ang=Math.atan2(dx,dz); let da=ang-o.rotation.y; while(da>Math.PI) da-=Math.PI*2; while(da<-Math.PI) da+=Math.PI*2; o.rotation.y+=da*Math.min(1,dt*10);
      if(rig){ rig.walkPh+=st*(3.6/Math.max(0.9,o.scale.x)); poseWalk(rig,rig.walkPh,Math.min(1,m.speed/1.2)); }
      else o.position.y=m.base+Math.abs(Math.sin(T*9+m.ph))*0.05;
    }
    for(let i=anims.length-1;i>=0;i--){ const f=anims[i]; if(f&&f(dt,T)===false){ const j=anims.indexOf(f); if(j>=0) anims.splice(j,1); } }
    actors.forEach(A=>updActor(A,dt,T));
    if(waiter&&waiter.userData.waiter) updWaiter(waiter.userData.waiter,dt,T);
    if(barista) updBarista(barista,dt,T);
    // まばたき・待機モーション・顔の詳細度
    const cp=camera.position;
    for(let i=0;i<people.length;i++){ const p=people[i], r=p.userData.rig; if(!p.parent) continue;
      r.blink-=dt; if(r.eyes){ if(r.blink<0){ r.eyes.scale.y=0.12; if(r.blink<-0.12) r.blink=rand(2,5); } else r.eyes.scale.y=1; }
      if(p.userData.idle&&!p.userData.moving){ r.spine.rotation.z=Math.sin(T*0.9+r.ph)*0.02; r.head.rotation.y=Math.sin(T*0.35+r.ph)*0.35; if(p.userData.camera){ r.sh[1].rotation.x=-1.3; r.el[1].rotation.x=-1.2; r.sh[0].rotation.x=-1.2; r.el[0].rotation.x=-1.3; } }
      const dx=p.position.x-cp.x, dy=1.4-cp.y, dz=p.position.z-cp.z, d2=dx*dx+dy*dy+dz*dz;
      const lod=d2<150?0:d2<700?1:2;
      if(lod!==r.lod){ r.lod=lod; r.details.visible=lod===0; const sv=lod<2; for(let j=0;j<r.small.length;j++) r.small[j].visible=sv; }
    }
    let fl=1;
    if(flicker) fl=Math.random()<0.08?0.25:1;
    signMat.color.setScalar(fl);
    if(dimInterior&&Math.random()<0.05) bulbMat.emissiveIntensity=Math.random()<0.5?0.1:0.4;
    // カメラ
    if(cine.on){
      const s=cine.list[cine.i]; cine.t+=dt;
      const k=ease(Math.min(1,cine.t/s.dur));
      const kk=s.finale?1-Math.pow(1-Math.min(1,cine.t/s.dur),3):k;
      camera.position.lerpVectors(s.p0,s.p1,kk); lookNow.lerpVectors(s.l0,s.l1,kk);
      camera.lookAt(lookNow);
      if(cine.t>=s.dur) nextShot();
    } else {
      if(!dragging){ idle+=dt; if(idle>2.5&&!reduceMotion) theta+=dt*0.06; }
      orbitPos(camera.position); lookNow.copy(target); camera.lookAt(target);
    }
    sky.position.copy(camera.position);
    sunDisc.position.copy(camera.position).addScaledVector(SUN,600);
    renderer.render(scene,camera);
  }
  /* ---- 静的なメッシュを材質ごとに結合（描画負荷の削減） ---- */
  function mergeStatic(root){
    root.updateMatrixWorld(true);
    const inv=new THREE.Matrix4().copy(root.matrixWorld).invert();
    const buckets=new Map(), victims=new Set();
    root.traverse(o=>{
      if(!o.isMesh||o.isInstancedMesh||o.renderOrder||o.userData.keep) return;
      for(let p=o.parent;p&&p!==root;p=p.parent) if(p.userData.noMerge) return;
      const g=o.geometry; if(!g.attributes.normal||!g.attributes.uv) return;
      const arr=Array.isArray(o.material), mats=arr?o.material:[o.material];
      if(mats.some(m=>m.transparent)) return;
      const groups=arr&&g.groups.length?g.groups:[{start:0,count:g.index?g.index.count:g.attributes.position.count,materialIndex:0}];
      groups.forEach(gr=>{ const m=mats[gr.materialIndex]; const key=m.uuid+"|"+o.castShadow; let b=buckets.get(key); if(!b){ b={m,cast:o.castShadow,parts:[],n:0}; buckets.set(key,b); } b.parts.push({o,gr}); b.n+=gr.count; });
      victims.add(o);
    });
    const m4=new THREE.Matrix4(), n3=new THREE.Matrix3(), v=new V3();
    buckets.forEach(b=>{
      const pos=new Float32Array(b.n*3), nor=new Float32Array(b.n*3), uv=new Float32Array(b.n*2); let k=0;
      b.parts.forEach(({o,gr})=>{
        m4.multiplyMatrices(inv,o.matrixWorld); n3.getNormalMatrix(m4);
        const g=o.geometry, P=g.attributes.position, N=g.attributes.normal, U=g.attributes.uv, I=g.index;
        for(let j=0;j<gr.count;j++){ const idx=I?I.getX(gr.start+j):gr.start+j;
          v.fromBufferAttribute(P,idx).applyMatrix4(m4); pos[k*3]=v.x; pos[k*3+1]=v.y; pos[k*3+2]=v.z;
          v.fromBufferAttribute(N,idx).applyMatrix3(n3).normalize(); nor[k*3]=v.x; nor[k*3+1]=v.y; nor[k*3+2]=v.z;
          uv[k*2]=U.getX(idx); uv[k*2+1]=U.getY(idx); k++; }
      });
      const mg=new THREE.BufferGeometry();
      mg.setAttribute("position",new THREE.BufferAttribute(pos,3)); mg.setAttribute("normal",new THREE.BufferAttribute(nor,3)); mg.setAttribute("uv",new THREE.BufferAttribute(uv,2));
      mg.computeBoundingSphere();
      const mm=new THREE.Mesh(mg,b.m); mm.castShadow=b.cast; mm.receiveShadow=true; mm.userData.keep=true; root.add(mm);
    });
    victims.forEach(o=>{ o.parent.remove(o); if(!o.geometry.userData.shared) o.geometry.dispose(); });
  }
  [G_TTOP,G_TLEG,G_TBASE,G_SEAT,G_CLEG,G_POST,G_BACK,G_SHADE].forEach(g=>g.userData.shared=true);
  deco.starCeil.userData.keep=true;
  const toggles=[city,trees,carpet,deco.chandelier,deco.neon,deco.greens,...Object.values(LM)];
  toggles.forEach(g=>{ mergeStatic(g); g.userData.noMerge=true; });
  dyn.userData.noMerge=true; clouds.userData.noMerge=true;
  mergeStatic(scene);

  prepare();
  if(document.fonts&&document.fonts.ready) document.fonts.ready.then(()=>{ if(!running&&$("#banner").hidden){ drawSign("準備中 ― まもなく開店します",null,"#f1cf6a"); drawMenu("ブレンドコーヒー","本日のケーキ"); } });
  loop();
  return {prepare,run};
}
</script>
